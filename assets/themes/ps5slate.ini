########## PS5 Slate ##########
# Dark slate-blue, translucent tiles, white focus highlight with dark text.
# Modelled on the PS5 home screen reference screenshots.

[PS5Slate]
Name = "PS5 Slate"

BackgroundColor = "#0D1420FF"
ScrollbarColor = "#FFFFFF55"

ItemStyleFg = "#E8EEF8FF"
ItemStyleBg = "#FFFFFF14"
ItemFocusedStyleFg = "#0B1018FF"
ItemFocusedStyleBg = "#F2F5FAFF"
ItemDownStyleFg = "#0B1018FF"
ItemDownStyleBg = "#B9C6DCFF"
ItemDisabledStyleFg = "#E8EEF855"
ItemDisabledStyleBg = "#FFFFFF08"

HeaderStyleFg = "#FFFFFFFF"
HeaderStyleBg = "#00000000"
CollapsibleHeaderStyleFg = "#FFFFFFFF"
CollapsibleHeaderStyleBg = "#FFFFFF1F"

InfoStyleFg = "#AEBBD0FF"
InfoStyleBg = "#00000000"
TooltipStyleFg = "#FFFFFFFF"
TooltipStyleBg = "#1A2436F0"

PopupStyleFg = "#FFFFFFFF"
PopupStyleBg = "#141C2BF5"
PopupTitleStyleFg = "#FFFFFFFF"
PopupTitleStyleBg = "#00000000"
PopupSliderColor = "#FFFFFFFF"
PopupSliderFocusedColor = "#0070D1FF"
